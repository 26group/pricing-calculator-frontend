<svg width="200" height="40" viewBox="0 0 200 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#422AFB"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  
  <!-- Icon: A shape with straight upward line -->
  <g transform="translate(2, 4)">
    <!-- Rounded square background -->
    <rect x="0" y="0" width="32" height="32" rx="8" fill="url(#primaryGradient)"/>
    
    <!-- Left arm of A (white) -->
    <path d="M6 20L11 13" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- Tick portion: down from A peak, then up (teal) -->
    <path d="M11 13L16 20L26 8" stroke="url(#accentGradient)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  
  <!-- Wordmark: "Accountable" in Public Sans Bold -->
  <text x="42" y="27" font-family="'Public Sans', system-ui, -apple-system, sans-serif" font-size="21" font-weight="700" letter-spacing="-0.02em" fill="#1a1a2e">Accountable</text>
</svg>
