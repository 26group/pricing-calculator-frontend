      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#422AFB"/>
    </linearGradient>
    <linearGradient id="iconAccentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06B6D4"/>
