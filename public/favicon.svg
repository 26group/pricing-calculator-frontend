<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="faviconPrimaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#422AFB"/>
    </linearGradient>
    <linearGradient id="faviconAccentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  
  <!-- Rounded square background -->
  <rect x="0" y="0" width="512" height="512" rx="128" fill="url(#faviconPrimaryGradient)"/>
  
  <!-- Left arm of A (white) - scaled 16x from 32px version -->
  <path d="M96 320L176 208" stroke="#ffffff" stroke-width="72" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Tick portion: down from A peak, then up (teal) - scaled 16x from 32px version -->
  <path d="M176 208L256 320L416 128" stroke="url(#faviconAccentGradient)" stroke-width="72" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
